name: Build and verify Home Personalisation 0.1.17 RC
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-homepersonalisation-017.yml'
      - 'tools/build-homepersonalisation-017.py'
      - 'tests/test_cw_017_queue.py'
      - 'release-candidates/homepersonalisation-0.1.17/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build-homepersonalisation-017.py
      - run: python -m unittest discover -s tests -v
      - run: sha256sum -c SHA256SUMS.txt
      - name: Publish tested opt-in ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin.video.tvstreaming.homepersonalisation-0.1.17-RC.zip SHA256SUMS.txt index.html
          git diff --cached --quiet && exit 0
          git commit -m "Publish tested Home Personalisation 0.1.17 RC"
          git push origin HEAD:main
