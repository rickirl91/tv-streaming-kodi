name: Verify Next Episode
on:
  push:
    paths:
      - 'src/nextepisode/**'
      - 'tests/test_next_episode_resolver.py'
      - '.github/workflows/verify-next-episode.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q src/nextepisode
      - run: python -m unittest discover -s tests -p test_next_episode_resolver.py -v
