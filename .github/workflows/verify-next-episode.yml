name: Verify consolidated Kodi release
on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - '**.zip'
      - 'index.html'
      - 'archive/index.html'
      - 'SHA256SUMS.txt'
      - 'tools/build-consolidated-rc.py'
      - '.github/workflows/verify-next-episode.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q src tests tools/build-consolidated-rc.py
      - run: python tools/build-consolidated-rc.py --check
      - run: sha256sum -c SHA256SUMS.txt
      - run: python -m unittest discover -s tests -v
