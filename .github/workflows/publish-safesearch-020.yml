name: Build and verify Cricky Safe Search 0.2.0 RC
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-safesearch-020.yml'
      - 'tools/build-safesearch-020.py'
      - 'tests/test_safesearch_020.py'
      - 'release-candidates/safesearch-0.2.0/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_safesearch_020.py -v
      - run: python tools/build-safesearch-020.py
      - run: grep '  script.tvstreaming.safesearch-0.2.0-RC.zip$' SHA256SUMS.txt | sha256sum -c -
      - name: Publish tested Search-only ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.tvstreaming.safesearch-0.2.0-RC.zip SHA256SUMS.txt index.html
          git diff --cached --quiet && exit 0
          git commit -m "Publish tested Cricky Safe Search 0.2.0 RC"
          git push origin HEAD:main
